# Static UI plus a reverse proxy to the API replicas. Docker DNS returns every replica,
# and the short resolver TTL lets nginx follow replicas that come and go.
resolver 127.0.0.11 valid=5s ipv6=off;
limit_req_zone $binary_remote_addr zone=perip:10m rate=300r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Prometheus scrapes the replicas directly, never through the public entry point.
    location /api/metrics { return 404; }

    location /api/ {
        limit_req zone=perip burst=300 nodelay;
        set $upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
