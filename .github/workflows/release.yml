name: release

# Tag vX.Y.Z -> checks the tag against pyproject.toml, builds the package, publishes the
# images on GHCR (version and commit tags, never latest) and creates the GitHub release with
# the CHANGELOG notes, the wheel, the sdist and the PDF report attached.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tag matches pyproject.toml
        run: python scripts/sync_version.py --tag "$GITHUB_REF_NAME"
      - name: Version files agree
        run: python scripts/sync_version.py --check
      - name: Release notes from CHANGELOG
        run: python scripts/sync_version.py --notes "${GITHUB_REF_NAME#v}" > notes.md
      - name: Build wheel and sdist
        run: pip install build && python -m build
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish images
        run: |
          version="${GITHUB_REF_NAME#v}"
          for image in api gateway mlflow; do
            docker build -f "docker/${image}.Dockerfile" \
              -t "ghcr.io/adam-blf/eurosat-${image}:${version}" \
              -t "ghcr.io/adam-blf/eurosat-${image}:${GITHUB_SHA}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.version=${version}" .
            docker push --all-tags "ghcr.io/adam-blf/eurosat-${image}"
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md dist/* reports/*.pdf
