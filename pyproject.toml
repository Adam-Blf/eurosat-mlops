[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eurosat-mlops"
version = "0.1.0"
description = "Production MLOps for satellite land-use classification on EuroSAT: token API, MLflow registry, drift, Terraform, k8s canary."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Adam Beloucif", email = "adam.beloucif@efrei.net" },
  { name = "Emilien Morice" },
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.18",
  "pillow>=10.4",
  "numpy>=1.26",
  "onnxruntime>=1.18",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "prometheus-client>=0.20",
  "scipy>=1.11",
  "pydantic-settings>=2.3",
  "mlflow-skinny>=3.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.3",
  "torchvision>=0.18",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "onnx>=1.16",
  "onnxscript>=0.2",
  "mlflow>=3.0",
]
loadtest = ["locust>=2.29"]
report = ["fpdf2>=2.8", "matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/eurosat_mlops"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "loadtest", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
